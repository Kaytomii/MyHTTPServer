<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>404 — Страница не найдена</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            color: #fff;
        }

        header {
            background: #111122;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

            header h1 {
                margin: 0;
                font-size: 32px;
                letter-spacing: 2px;
                color: #6ab0ff;
            }

        nav {
            margin-top: 10px;
        }

            nav a {
                color: #cfd8ff;
                text-decoration: none;
                margin: 0 15px;
                font-size: 18px;
                transition: 0.3s;
            }

                nav a:hover {
                    color: #6ab0ff;
                    text-shadow: 0 0 10px #6ab0ff;
                }

        .container {
            display: flex;
            justify-content: center;
            margin-top: 80px;
        }

        .card {
            background: #2a2a3d;
            padding: 40px 50px;
            border-radius: 12px;
            text-align: center;
            width: 500px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }

            .card:hover {
                transform: translateY(-5px);
            }

            .card h2 {
                margin-top: 0;
                color: #ff6a6a;
                font-size: 40px;
            }

            .card p {
                font-size: 18px;
                color: #d6d6e8;
                margin-bottom: 25px;
            }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #6ab0ff;
            color: #111122;
            font-size: 18px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        }

            .btn:hover {
                background: #8bc3ff;
                box-shadow: 0 0 15px #6ab0ff;
            }
    </style>
</head>
<body>

    <header>
        <h1>GameStore</h1>
        <nav>
            <a href="#">Главная</a>
            <a href="about">О нас</a>
            <a href="contacts">Контакты</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h2>404</h2>
            <p>Упс! Такой страницы не существует.</p>
            <a class="btn" href="#">Вернуться на главную</a>
        </div>
    </div>

</body>
</html>
